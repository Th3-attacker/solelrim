allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Transitive-only build-tool deps flagged by `pnpm audit` (nanoid via
# postcss/webpack pulled in by @sentry/nextjs's build plugin; deepmerge-ts
# via the Prisma CLI's config loader) — neither ships in the app's runtime
# bundle, but pinning to the patched range closes the advisory outright.
overrides:
  nanoid: '>=3.3.18'
  deepmerge-ts: '>=8.0.0'
  # next's image optimiser (libheif advisories, fixed in 0.35.4).
  sharp: '>=0.35.4'
  # Transitives runtime signalées par `pnpm audit` : fast-uri (via
  # @hookform/resolvers > ajv) et js-yaml (via @tanstack/react-start).
  # On force la plage corrigée ; le verrou garde la dernière version.
  fast-uri: '^3.1.8'
  js-yaml: '^4.3.2'
