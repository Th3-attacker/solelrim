name: CI

on:
  pull_request:
    branches: [dev, staging, master]

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    # `pnpm install`'s own postinstall hook runs `prisma generate`, and
    # prisma.config.ts reads DIRECT_URL eagerly just to load the config —
    # `generate` never opens a connection, so these never need to resolve
    # to a real database, just be set to something.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Report-only (see vitest.config.ts — no `thresholds` configured), so
      # a low or dropping number is visible in the log but never blocks a PR.
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    # pnpm build runs `prisma migrate deploy` before `next build` — an
    # ephemeral database here so that's validated against a real Postgres
    # (migrations applying cleanly, no build-time query breaking) without
    # ever touching the real dev/staging database. Supabase env vars are
    # placeholders: the Supabase JS client only makes network calls inside
    # request handlers, never at build time, so a fake URL/key is enough
    # for the build itself to succeed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solelrim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solelrim
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/solelrim
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bare postgres:16-alpine has neither of two things every real
      # Supabase project has by default, and two migrations assume:
      # - 20260720111215_enable_row_level_security grants to the
      #   anon/authenticated PostgREST roles (P3018 without them).
      # - 20260820110000_enable_unaccent installs the unaccent extension
      #   into an "extensions" schema (P3018 without it existing first).
      # Both created here rather than made defensive in the migrations
      # themselves — those already applied against the real dev/staging
      # database, so editing their SQL now would just make Prisma see a
      # checksum mismatch against what's recorded there next deploy.
      - run: |
          psql "$DATABASE_URL" -c 'CREATE ROLE anon;' -c 'CREATE ROLE authenticated;' -c 'CREATE SCHEMA IF NOT EXISTS extensions;'

      - run: pnpm build

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash-merges use the PR title as the final commit message — the
      # commit-msg hook (husky + commitlint) only runs on local commits, so
      # this is what actually catches a malformed title before it lands.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            style
            test
            docs
            build
            ci
            chore
            revert
